<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha - SCC-Vendas</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container-fluid min-vh-100 p-0">
    <div class="row min-vh-100 g-0">
      
      
      <div class="col-md-6 d-flex flex-column justify-content-center align-items-center left-column p-5 text-center">
        <h1 class="display-3 fw-bold mb-4">Seja bem vindo!</h1>
       
        <img src="ilustracao.png" alt="Ilustração de gestão de vendas" class="img-fluid mb-4" style="max-width: 85%;">      
      </div>
      
      
      <div class="col-md-6 d-flex flex-column justify-content-center right-column p-5 position-relative">
        <h1 class="display-1 fw-bold main-title mb-1 text-center">SCC-Vendas</h1>
        <p class="text-white text-center subtitle mb-5">Organize suas vendas e clientes em poucos cliques.</p>
        
       
        <div class="text-center mb-4">
          <p class="text-white fs-5">Digite seu email para redefinir sua senha</p>
        </div>
        
        
        <form action="index.html" class="w-75 mx-auto">
          <div class="mb-4">
            <label for="email-recuperacao" class="form-label visually-hidden">Email</label>
            <input type="email" class="form-control p-3 custom-input" id="email-recuperacao" placeholder="Email" required>
          </div>
          <div class="d-grid mb-4">
            
            <button type="submit" class="btn btn-primary p-3 custom-btn">Confirmar</button>
          </div>
        </form>
        
        
        <div class="text-center mt-3">
          <a href="index.html" class="text-white small text-decoration-none">Voltar para a tela inicial</a>
        </div>
      </div>
      
    </div>
  </div>
</body>
</html>
