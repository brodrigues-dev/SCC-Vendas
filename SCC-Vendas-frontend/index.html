<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SCC - Vendas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
 
  <link rel="stylesheet" href="style.css">
</head>
<body>
    
  <div class="container-fluid min-vh-100 p-0">
    
    <div class="row min-vh-100 g-0">
      
      
      <div class="col-md-6 d-flex flex-column justify-content-center align-items-center left-column p-5 text-center">
       
        <h1 class="display-3 fw-bold mb-4">Seja bem vindo!</h1>
        
<img src="ilustracao.png" alt="Ilustração de gestão de vendas" class="img-fluid mb-4" style="max-width: 85%;">      </div>
      
      
      <div class="col-md-6 d-flex flex-column justify-content-center right-column p-5">
       
        <h1 class="display-1 fw-bold main-title mb-1 text-center">SCC-Vendas</h1>
       
        <p class="text-muted text-center subtitle mb-5">Organize suas vendas e clientes em poucos cliques.</p>
        
        
        <div class="d-flex justify-content-center mb-4">
         
          <a href="#" class="btn btn-primary active mx-2 px-4 py-2">Login</a>
          
          <span class="text-white mx-1 align-self-center">ou</span>
         
          <a href="cadastro.html" class="btn btn-secondary mx-2 px-4 py-2">Cadastrar</a>
        </div>
        
        
        <form action="dashboard.html">
          <div class="mb-3">
            
            <label for="email" class="form-label visually-hidden">Email</label>
            
            <input type="email" class="form-control p-3 custom-input" id="email" placeholder="Email" required>
          </div>
          <div class="mb-3">
            
            <label for="password" class="form-label visually-hidden">Senha</label>
            
            <input type="password" class="form-control p-3 custom-input" id="password" placeholder="Senha" required>
          </div>
          <div class="d-grid mb-4">
            
            <button type="submit" class="btn btn-primary p-3 custom-btn">Entrar</button>
          </div>
        </form>
        
        
        <div class="text-center">
          <a href="esqueci_senha.html" class="text-white small text-decoration-none">Esqueci minha senha</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
