<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Produto - SCC-Vendas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .dashboard-sidebar { background-color: var(--azul-escuro, #232946); border-radius: 0 40px 40px 0; min-height: 100vh; }
    .dashboard-sidebar .nav-link { color: var(--amarelo, #eebbc3) !important; border-radius: 8px; }
    .dashboard-sidebar .nav-link.active-page { background-color: rgba(255,255,255,0.1); color: white !important; }
    .form-header { background-color: #232946; color: white; padding: 15px 30px; border-radius: 12px 12px 0 0; font-size: 1.25rem; font-weight: bold; margin-bottom: 0; }
    .form-body { background-color: white; padding: 30px; border-radius: 0 0 12px 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .custom-input { background-color: #E2E8F0; border: none; border-radius: 8px; padding: 12px 15px; font-weight: 500; width: 100%; }
    .custom-label { font-weight: 700; color: #000; font-size: 0.9rem; margin-bottom: 8px; display: block; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .grid-full { grid-column: 1 / -1; }
    @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
    .custom-modal { border-radius: 20px; text-align: center; padding: 40px 20px; border: none; }
    .icon-circle { width: 80px; height: 80px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 40px; color: white; margin-bottom: 20px; }
  </style>
</head>
<body style="background-color: #f1f5f9; overflow-x: hidden;">
  <div class="row g-0 min-vh-100">
    <div class="col-md-3 col-lg-2 d-flex flex-column p-4 dashboard-sidebar">
        <h3 class="fw-bold mb-4" style="color: var(--amarelo);">SCC-Vendas</h3>
        <div class="d-flex align-items-center mb-4 pb-3 border-bottom border-secondary">
          <div class="rounded-circle bg-secondary d-flex justify-content-center align-items-center text-white fw-bold fs-4 me-3" style="width: 48px; height: 48px;">C</div>
          <div><span class="text-white small opacity-75">Olá,</span><h6 class="text-white fw-bold mb-0">Carlos!</h6></div>
        </div>
        <ul class="nav flex-column mb-auto gap-1">
          <li class="nav-item"><a href="dashboard.html" class="nav-link p-2">Inicio</a></li>
          <li class="nav-item"><a href="clientes.html" class="nav-link p-2">Clientes</a></li>
          <li class="nav-item"><a href="produtos.html" class="nav-link active-page p-2 d-flex align-items-center"><span class="d-inline-block bg-white rounded-pill me-2" style="width: 5px; height: 16px;"></span> Produtos</a></li>
          <li class="nav-item"><a href="vendas.html" class="nav-link p-2">Vendas</a></li>
          <li class="nav-item"><a href="relatorios.html" class="nav-link p-2">Relatórios</a></li>
        </ul>
        <hr class="text-secondary my-4">
        <div><a href="index.html" class="nav-link fw-bold small p-2">Sair da conta</a></div>
    </div>
    <div class="col-md-9 col-lg-10 p-4 p-md-5">
      <div class="form-header">Cadastro de produtos</div>
      <div class="form-body mb-5">
        <h5 class="fw-bold text-dark mb-4">Novo produto</h5>
        <form>
          <div class="form-grid">
            <div><label class="custom-label">Nome do produto</label><input type="text" id="nomeProd" class="form-control custom-input" placeholder="Digite o nome..."></div>
            <div><label class="custom-label">Código/SKU</label><input type="text" class="form-control custom-input" placeholder="Digite o código..."></div>
            <div><label class="custom-label">Categoria</label><input type="text" class="form-control custom-input" placeholder="Digite a categoria..."></div>
            <div><label class="custom-label">Estoque Inicial</label><input type="number" id="estProd" class="form-control custom-input" placeholder="Digite o estoque..."></div>
            <div><label class="custom-label">Preço unitário</label><input type="text" class="form-control custom-input" placeholder="R$ 0,00"></div>
            <div class="grid-full"><label class="custom-label">Descrição</label><textarea class="form-control custom-input" rows="3" placeholder="Descrição..."></textarea></div>
          </div>
          <div class="d-flex justify-content-end gap-3 mt-5 pt-3 border-top">
            <a href="produtos.html" class="btn px-4 py-2 fw-bold text-dark" style="background-color: #cbd5e1; border-radius: 8px;">Cancelar</a>
            <button type="button" class="btn px-4 py-2 fw-bold text-dark" style="background-color: #e2e8f0; border-radius: 8px;" data-bs-toggle="modal" data-bs-target="#modalConf">Salvar produto</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <div class="modal fade" id="modalConf" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content custom-modal"><h4 class="fw-bold mb-4">Deseja cadastrar o produto?</h4><div class="d-flex justify-content-center gap-3"><button class="btn px-4 py-2 fw-bold" data-bs-dismiss="modal" style="background-color: #e2e8f0; border-radius: 8px;">Cancelar</button><button class="btn px-5 py-2 fw-bold text-white" style="background-color: #232946; border-radius: 8px;" onclick="processarProd()">Sim</button></div></div></div></div>
  <div class="modal fade" id="modalSuc" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content custom-modal"><div class="icon-circle bg-success mx-auto"><i class="bi bi-check-lg"></i></div><h4 class="fw-bold text-success mb-4">Produto salvo com sucesso!</h4><a href="produtos.html" class="btn btn-success px-5 py-2 fw-bold rounded-pill mx-auto">OK</a></div></div></div>
  <div class="modal fade" id="modalErr" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content custom-modal"><div class="icon-circle bg-danger mx-auto"><i class="bi bi-x-lg"></i></div><h4 class="fw-bold text-danger mb-2">Erro ao cadastrar.</h4><p class="text-muted mb-4">O Nome e Estoque são obrigatórios.</p><button class="btn btn-danger px-4 py-2 fw-bold rounded-pill mx-auto" data-bs-dismiss="modal">Voltar</button></div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function processarProd() { bootstrap.Modal.getInstance(document.getElementById('modalConf')).hide(); if(!document.getElementById('nomeProd').value || !document.getElementById('estProd').value) { new bootstrap.Modal(document.getElementById('modalErr')).show(); } else { new bootstrap.Modal(document.getElementById('modalSuc')).show(); } }
  </script>
</body>
</html>
